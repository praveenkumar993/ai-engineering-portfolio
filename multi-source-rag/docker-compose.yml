# docker-compose.yml — runs the app AND a real Qdrant server together.
#
# Why this matters (the payoff from Step 3):
#   Back in Step 3, we used Qdrant in local-disk mode specifically so we
#   could build and test without needing Docker yet. Now we switch to a
#   real Qdrant SERVER running in its own container -- the production
#   setup, exactly the "one-line change" we promised back then.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      - qdrant

volumes:
  qdrant_storage: